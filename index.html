<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Site Spooky</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0;
      background: #111; color: #eee;
      font-family: 'Creepster', cursive;
      overflow: hidden;
    }
    /* Écran de démarrage */
    #startOverlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: #f60;
      cursor: pointer; z-index: 2000;
      user-select: none;
    }
    /* Volume */
    #volume-control {
      position: absolute; top: 10px; right: 10px;
      display: flex; align-items: center; gap: 5px;
      z-index: 100;
    }
    #volume-control input { cursor: pointer; }

    /* Rangées */
    #top-row, #bottom-row {
      display: flex; justify-content: center; align-items: center;
    }
    #top-row { margin-top: 60px; }
    #bottom-row { margin-top: 80px; }

    img.draggable {
      max-width: 100px; margin: 10px;
      cursor: grab; transition: transform .2s ease;
    }
    img.draggable:active {
      cursor: grabbing; transform: scale(1.1);
    }

    /* Overlay Cerf */
    #deerOverlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('deer.png') center/cover no-repeat;
      opacity: 0; transition: opacity 3s ease;
      pointer-events: none; z-index: 1500;
    }

    /* Container final */
    #finalContainer {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      opacity: 0; transition: opacity 3s ease;
      background: #111; z-index: 2000;
    }
    #finalContainer img {
      flex: 1;
      height: 50vh;
      width: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="startOverlay">Cliquez pour démarrer la confection de votre potion</div>

  <!-- Audios -->
  <audio id="mainMusic" src="musique.mp3" loop muted autoplay preload="auto"></audio>
  <audio id="usedSound" src="used.mp3" preload="auto"></audio>
  <audio id="deadSound" src="deadm.mp3" preload="auto"></audio>

  <!-- Volume -->
  <div id="volume-control">
    <label for="vol">🔊</label>
    <input type="range" id="vol" min="0" max="100" value="40">
  </div>

  <!-- Images haut -->
  <div id="top-row">
    <img id="champ"      class="draggable" src="champ.png"      alt="">
    <img id="chien"      class="draggable" src="chien.png"      alt="">
    <img id="citrouille" class="draggable" src="citrouille.png" alt="">
    <img id="mandragore" class="draggable" src="mandragore.png" alt="">
    <img id="feu"        class="draggable" src="feu.png"        alt="">
  </div>

  <!-- Images bas -->
  <div id="bottom-row">
    <img id="casserole" class="draggable" src="casserole.png" alt="">
    <img id="knife"     class="draggable" src="knife.png"     alt="">
  </div>

  <!-- Overlay Cerf -->
  <div id="deerOverlay"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const startOv   = document.getElementById('startOverlay');
      const mainMusic = document.getElementById('mainMusic');
      const usedSound = document.getElementById('usedSound');
      const deadSound = document.getElementById('deadSound');
      const volSlider = document.getElementById('vol');
      const deerOv    = document.getElementById('deerOverlay');
      const topRow    = document.getElementById('top-row');
      const pot       = document.getElementById('casserole');
      let cond1 = 0, cond2 = 0, fail1 = 0;

      // 1) Démarrage (unlock audio)
      startOv.addEventListener('click', () => {
        mainMusic.muted = false;
        mainMusic.volume = volSlider.value/100;
        deadSound.volume   = volSlider.value/100;
        mainMusic.play();
        startOv.style.display = 'none';
      });

      // 2) Volume slider
      volSlider.addEventListener('input', e => {
        mainMusic.volume = e.target.value/100;
        deadSound.volume = e.target.value/100;
      });

      // 3) Dragstart global
      document.addEventListener('dragstart', e => {
        if (e.target.classList.contains('draggable')) {
          e.dataTransfer.setData('text/plain', e.target.id);
        }
      });

      // 4) Knife → top-row
      topRow.addEventListener('dragover', e => e.preventDefault());
      topRow.addEventListener('drop', e => {
        e.preventDefault();
        if (e.dataTransfer.getData('text/plain') !== 'knife') return;
        const tgt = e.target;
        if (tgt.tagName !== 'IMG') return;
        const map = {
          'champ':      'champh',
          'chien':      'chienh',
          'citrouille': 'citrouilleh',
          'mandragore': 'mandragoreh',
          'mandragoreo':'mandragoreh',
          'chiend':     'chiendh'
        };
        if (map[tgt.id]) {
          tgt.src = map[tgt.id] + '.png';
          tgt.id  = map[tgt.id];
        }
      });

      // 5) Clic mandragore → cerf + deadSound
      const mand = document.getElementById('mandragore');
      mand.addEventListener('click', e => {
        if (e.currentTarget.id !== 'mandragore') return;

        mainMusic.pause();
        deadSound.currentTime = 0;
        deadSound.play().catch(console.warn);
        deerOv.style.opacity = '1';
        });

      // 6) Chien → mandragore
      mand.addEventListener('dragover', e => e.preventDefault());
      mand.addEventListener('drop', e => {
        e.preventDefault();
        if (e.dataTransfer.getData('text/plain') === 'chien') {
          mand.src = 'mandragoreo.png'; mand.id = 'mandragoreo';
          const dog = document.getElementById('chien');
          dog.src = 'chiend.png'; dog.id = 'chiend';
        }
      });

      // 7) Drop sur casserole / casseroleb
      pot.addEventListener('dragover', e => e.preventDefault());
      pot.addEventListener('drop', e => {
        e.preventDefault();
        const item = e.dataTransfer.getData('text/plain');
        const elm  = document.getElementById(item);
        if (elm) elm.style.display = 'none';
        usedSound.currentTime = 0;
        usedSound.play().catch(console.warn);

        if (pot.id === 'casserole') {
          if (item === 'mandragoreo') cond1 = 1;
          else if (item === 'feu') {
            pot.src = 'casseroleb.png'; pot.id = 'casseroleb';
          } else fail1 = 1;
        } else {
          if (item === 'citrouilleh') cond2 = 1;
          else fail1 = 1;
        }
        checkVictory();
      });

      // 8) Victoire avec fondue + adaptation hauteur
      function checkVictory() {
        if (cond1 === 1 && cond2 === 1 && fail1 === 0) {
          // Créer le container final
          const container = document.createElement('div');
          container.id = 'finalContainer';
          const b = new Image(), p = new Image();
          b.src = 'bandeau.png'; b.id = 'bandeau';
          p.src = 'potion.png'; p.id = 'potion';
          container.append(b, p);

          // Remplacer le body, puis lancer fondu
          document.body.innerHTML = '';
          document.body.append(container);
          // petit délai pour que transition CSS prenne effet
          requestAnimationFrame(() => {
            container.style.opacity = '1';
          });
        }
      }
    });
  </script>
</body>
</html>
